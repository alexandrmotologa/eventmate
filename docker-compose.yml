services:
  eventmate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventmate
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-mock_token}
      - DEMO_MODE=${DEMO_MODE:-true}
      - DATABASE_PATH=/app/server/data/eventmate.db
      - APP_URL=${APP_URL:-http://localhost:8080}
    volumes:
      - eventmate_data:/app/server/data

volumes:
  eventmate_data:
